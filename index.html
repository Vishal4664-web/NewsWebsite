










<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aaj Tak News</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="NBC-news-news-logo.webp">
</head>

<body>
    <nav>
        <div class="main-nav container flex">

            <a href="#" onclick="reload(); return false;" class="company-logo">
                <img src="NBC-news-news-logo.webp" alt="Aaj Tak News logo">
            </a>

            <div class="nav-links">
                <ul class="flex">
                    <li class="hover-link nav-item"
                        id="ipl"
                        onclick="onNavItemClick('ipl')">
                        IPL
                    </li>

                    <li class="hover-link nav-item"
                        id="finance"
                        onclick="onNavItemClick('finance')">
                        Finance
                    </li>

                    <li class="hover-link nav-item"
                        id="politics"
                        onclick="onNavItemClick('politics')">
                        Politics
                    </li>
                </ul>
            </div>

            <div class="search-bar">
                <input
                    type="text"
                    class="news-input"
                    id="news-input"
                    placeholder="e.g. Science"
                >

                <button class="search-button" id="search-button">
                    Search
                </button>
            </div>

        </div>
    </nav>

    <main>
        <div class="cards-container container flex" id="cardscontainer">
        </div>
    </main>

    <template id="template-news-card">
        <div class="card">

            <div class="card-header">
                <img
                    src="https://placehold.co/400x200"
                    alt="News image"
                    id="news-img"
                >
            </div>

            <div class="card-content">
                <h3 id="news-title">News title</h3>

                <h6 id="news-source" class="news-source">
                    News source
                </h6>

                <p class="news-desc" id="news-desc">
                    News description
                </p>
            </div>

        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
